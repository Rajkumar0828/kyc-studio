
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  vault:
    image: hashicorp/vault:2.2.1
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN}
    command: server -dev -dev-listen-address=0.0.0.0:8200

volumes:
  mongo_data:
