services:
  # MongoDB with authentication. The root user and the app user (see
  # docker/mongo-init) are created ONLY when the data volume is empty; on an
  # existing volume run `docker compose down -v` once first (see docs/persistence.md).
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: kyc_studio
      MONGO_APP_USER: ${MONGO_APP_USER:?set MONGO_APP_USER in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Vault in dev mode (in-memory): a restart loses the transit mount, the
  # kyc-app policy, the app token and every key. vault-init puts the first three
  # back automatically; `npm run seed` repairs the demo cases.
  vault:
    image: hashicorp/vault:2.2.1
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:?set VAULT_DEV_TOKEN in .env}
      VAULT_ADDR: http://127.0.0.1:8200
    command: server -dev -dev-listen-address=0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Long-running and idempotent: every 20 s it re-creates the transit mount, the
  # kyc-app policy and the scoped app token if any is missing, and renews the token.
  vault-init:
    image: hashicorp/vault:2.2.1
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_TOKEN:?set VAULT_DEV_TOKEN in .env}
      VAULT_APP_TOKEN: ${VAULT_APP_TOKEN:?set VAULT_APP_TOKEN in .env}
    volumes:
      - ./docker/vault:/kyc:ro
    entrypoint: ["/bin/sh", "/kyc/init.sh"]

volumes:
  mongo_data:
